<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>audio-recorder — harness</title>
    <script src="./vendor/vue.global.prod.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; background: #f9fafb; }
      .audio-recorder { display: flex; flex-direction: column; gap: 8px; }
      .ar-row { display: flex; align-items: center; gap: 12px; }
      .ar-col { display: flex; flex-direction: column; gap: 8px; }
      .ar-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 14px; }
      .ar-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .ar-btn-primary { background: #166534; color: #fff; border-color: #166534; }
      .ar-btn-danger { background: #b91c1c; color: #fff; border-color: #b91c1c; }
      .ar-timer { font-variant-numeric: tabular-nums; font-weight: 600; }
      .ar-hint { color: #6b7280; font-size: 13px; }
      .ar-audio-hidden { display: none; }
      .ar-player { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 320px; padding: 8px 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; box-sizing: border-box; }
      .ar-play-btn { flex: 0 0 auto; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: #166534; color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
      .ar-progress { flex: 1 1 auto; height: 6px; background: #d1fae5; border-radius: 3px; overflow: hidden; }
      .ar-progress-fill { height: 100%; background: #16a34a; border-radius: 3px; }
      .ar-time { flex: 0 0 auto; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; color: #166534; }
      .ar-canvas { width: 100%; max-width: 280px; height: 48px; border-radius: 6px; background: #f0fdf4; display: block; }
      .ar-error { color: #b91c1c; font-size: 14px; margin: 0; }
      #debug { margin-top: 24px; padding: 12px; background: #fff; border-radius: 8px; font-family: monospace; font-size: 12px; color: #374151; min-height: 24px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug">—</div>

    <script>
      window.wwLib = {
        getFrontWindow: () => window,
        getFrontDocument: () => document,
      };
      window.__AR_LAST_SAVED__ = null;
      window.__AR_STATE__ = "idle";

      const AudioRecorder = {
        props: {
          uid: { type: String, required: true },
          content: { type: Object, required: true },
          wwEditorState: { type: Object, required: true },
        },
        emits: ["trigger-event"],
        template: `
          <div class="audio-recorder">
            <div v-if="state === 'idle'" class="ar-row">
              <button type="button" class="ar-btn ar-btn-primary" :disabled="isEditing" @click="startRecording">🎙️ Grabar audio</button>
              <span class="ar-hint">máx. {{ maxMinutesLabel }}</span>
            </div>
            <div v-else-if="state === 'recording'" class="ar-col">
              <canvas ref="waveformCanvas" class="ar-canvas" width="280" height="48"></canvas>
              <div class="ar-row">
                <button type="button" class="ar-btn ar-btn-danger" @click="stopRecording">⏹️ Detener</button>
                <span class="ar-timer">{{ elapsedLabel }}</span>
              </div>
            </div>
            <div v-else-if="state === 'preview' || state === 'saved'" class="ar-col">
              <div v-if="playerSrc" class="ar-player"><button type="button" class="ar-play-btn" @click="togglePlay">{{ isPlaying ? '⏸' : '▶' }}</button><div class="ar-progress"><div class="ar-progress-fill" :style="{ width: progressPct + '%' }"></div></div><span class="ar-time">{{ currentLabel }} / {{ totalLabel }}</span></div>
              <audio v-if="playerSrc" ref="previewAudio" :src="playerSrc" preload="metadata" class="ar-audio-hidden" @timeupdate="onTimeUpdate" @play="onPlay" @pause="onPause" @ended="onEnded"></audio>
              <div v-if="state === 'preview'" class="ar-row">
                <button type="button" class="ar-btn" @click="discardRecording">Volver a grabar</button>
                <button type="button" class="ar-btn ar-btn-primary" :disabled="!hasAudio" @click="saveRecording">Guardar grabación</button>
              </div>
              <div v-else class="ar-row">
                <button type="button" class="ar-btn" :disabled="isEditing" @click="reRecord">🎙️ Grabar de nuevo</button>
              </div>
            </div>
            <div v-else-if="state === 'error'" class="ar-col">
              <p class="ar-error">{{ errorMessage }}</p>
              <button type="button" class="ar-btn" @click="reset">Reintentar</button>
            </div>
          </div>
        `,
        data() {
          return {
            state: "idle",
            elapsed: 0,
            errorMessage: "",
            previewUrl: null,
            recordedFile: null,
            durationSec: 0,
            isPlaying: false,
            currentTime: 0,
            _mediaRecorder: null,
            _stream: null,
            _chunks: [],
            _timerId: null,
            _startTs: 0,
            _mimeType: "",
            _audioContext: null,
            _analyser: null,
            _freqData: null,
            _animFrameId: null,
            _waveformSamples: [],
            _lastSampleTime: 0,
            _progressRafId: null,
            _loadToken: 0,
          };
        },
        computed: {
          isEditing() { return this.wwEditorState.isEditing; },
          maxDurationSeconds() {
            const v = Number(this.content?.maxDurationSeconds);
            return Number.isFinite(v) && v > 0 ? v : 240;
          },
          savedAudioUrl() {
            const u = this.content?.savedAudioUrl;
            return typeof u === "string" && u ? u : "";
          },
          maxMinutesLabel() {
            const m = Math.floor(this.maxDurationSeconds / 60);
            const s = this.maxDurationSeconds % 60;
            return s === 0 ? `${m} min` : `${m}:${String(s).padStart(2, "0")} min`;
          },
          elapsedLabel() {
            const m = Math.floor(this.elapsed / 60);
            const s = this.elapsed % 60;
            return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
          },
          hasAudio() { return !!this.recordedFile && this.recordedFile.size > 0; },
          playerSrc() { return this.previewUrl || this.savedAudioUrl || ""; },
          currentLabel() { return this.fmtTime(this.currentTime); },
          totalLabel() { return this.fmtTime(this.durationSec); },
          progressPct() { return this.durationSec > 0 ? Math.min(100, (this.currentTime / this.durationSec) * 100) : 0; },
        },
        watch: {
          state(v) { window.__AR_STATE__ = v; },
          savedAudioUrl(url) {
            if (url && !this.previewUrl && (this.state === "idle" || this.state === "saved")) {
              this.loadSavedAudio(url);
            }
          },
        },
        mounted() {
          if (this.savedAudioUrl) this.loadSavedAudio(this.savedAudioUrl);
        },
        methods: {
          getWin() { return window.wwLib.getFrontWindow(); },
          pickMimeType(win) {
            const MR = win?.MediaRecorder;
            if (!MR || !MR.isTypeSupported) return "";
            const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/mpeg"];
            for (const c of candidates) { if (MR.isTypeSupported(c)) return c; }
            return "";
          },
          extFromMime(mime) {
            const m = (mime || "").toLowerCase();
            if (m.includes("webm")) return "webm";
            if (m.includes("mp4")) return "mp4";
            if (m.includes("mpeg")) return "mp3";
            if (m.includes("ogg")) return "ogg";
            if (m.includes("wav")) return "wav";
            return "webm";
          },
          async startRecording() {
            if (this.isEditing) return;
            const win = this.getWin();
            if (!win?.MediaRecorder || !win?.navigator?.mediaDevices?.getUserMedia) {
              this.errorMessage = "Tu navegador no soporta grabación de audio.";
              this.state = "error"; return;
            }
            try {
              this._stream = await win.navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
              this.errorMessage = "No se pudo acceder al micrófono. Puedes subir un archivo en su lugar.";
              this.state = "error"; return;
            }
            this._chunks = [];
            this._mimeType = this.pickMimeType(win);
            try {
              this._mediaRecorder = this._mimeType
                ? new win.MediaRecorder(this._stream, { mimeType: this._mimeType })
                : new win.MediaRecorder(this._stream);
            } catch (e) {
              this.teardownStream();
              this.errorMessage = "No se pudo iniciar la grabación.";
              this.state = "error"; return;
            }
            this._mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) this._chunks.push(ev.data); };
            this._mediaRecorder.onstop = () => this.finalize();
            this._mediaRecorder.start();
            this.elapsed = 0;
            this.currentTime = 0;
            this._startTs = Date.now();
            this.state = "recording";
            this._timerId = win.setInterval(() => this.tick(), 250);
            this.$nextTick(() => this.startVisualizer(win));
          },
          tick() {
            this.elapsed = Math.floor((Date.now() - this._startTs) / 1000);
            if (this.elapsed >= this.maxDurationSeconds) this.stopRecording();
          },
          stopRecording() {
            const win = this.getWin();
            this.durationSec = this._startTs ? Math.max(0, (Date.now() - this._startTs) / 1000) : this.elapsed;
            if (this._timerId) { win.clearInterval(this._timerId); this._timerId = null; }
            this.stopVisualizer(win);
            if (this._mediaRecorder && this._mediaRecorder.state !== "inactive") {
              this._mediaRecorder.stop();
            } else {
              this.finalize();
            }
          },
          finalize() {
            const win = this.getWin();
            const type = this._mimeType || (this._chunks[0] && this._chunks[0].type) || "audio/webm";
            const blob = new win.Blob(this._chunks, { type });
            const ext = this.extFromMime(type);
            const name = `grabacion_${Date.now()}.${ext}`;
            this.recordedFile = new win.File([blob], name, { type });
            if (this.previewUrl) win.URL.revokeObjectURL(this.previewUrl);
            this.previewUrl = blob.size > 0 ? win.URL.createObjectURL(blob) : null;
            this.currentTime = 0;
            this.teardownStream();
            this.state = "preview";
          },
          async loadSavedAudio(url) {
            const win = this.getWin();
            this.stopProgressLoop();
            this.isPlaying = false;
            this.currentTime = 0;
            this.durationSec = 0;
            this.recordedFile = null;
            if (this.previewUrl) { win.URL.revokeObjectURL(this.previewUrl); this.previewUrl = null; }
            this.state = "saved";
            const token = ++this._loadToken;
            try {
              const resp = await win.fetch(url);
              const buf = await resp.arrayBuffer();
              const Ctx = win.AudioContext || win.webkitAudioContext;
              if (Ctx) {
                const ctx = new Ctx();
                const decoded = await ctx.decodeAudioData(buf.slice(0));
                if (token === this._loadToken) this.durationSec = decoded.duration;
                try { ctx.close(); } catch (e) {}
              }
            } catch (e) {
              if (token === this._loadToken) this.durationSec = 0;
            }
          },
          fmtTime(sec) {
            const s = Number.isFinite(sec) && sec > 0 ? sec : 0;
            const m = Math.floor(s / 60);
            const ss = Math.floor(s % 60);
            return `${m}:${String(ss).padStart(2, "0")}`;
          },
          togglePlay() {
            const a = this.$refs.previewAudio;
            if (!a) return;
            if (a.paused) { a.play().catch(() => {}); } else { a.pause(); }
          },
          onTimeUpdate() {
            const a = this.$refs.previewAudio;
            if (a && !this.isPlaying) this.currentTime = a.currentTime;
          },
          onPlay() { this.isPlaying = true; this.startProgressLoop(); },
          onPause() { this.isPlaying = false; this.stopProgressLoop(); },
          startProgressLoop() {
            const win = this.getWin();
            this.stopProgressLoop();
            const tick = () => {
              const a = this.$refs.previewAudio;
              if (!a) return;
              this.currentTime = a.currentTime;
              if (!a.paused && !a.ended) { this._progressRafId = win.requestAnimationFrame(tick); }
            };
            this._progressRafId = win.requestAnimationFrame(tick);
          },
          stopProgressLoop() {
            if (this._progressRafId) { this.getWin().cancelAnimationFrame(this._progressRafId); this._progressRafId = null; }
          },
          onEnded() {
            this.isPlaying = false;
            this.stopProgressLoop();
            this.currentTime = this.durationSec;
          },
          discardRecording() {
            this.cleanupPreview();
            if (this.savedAudioUrl) { this.loadSavedAudio(this.savedAudioUrl); } else { this.reset(); }
          },
          reRecord() {
            this.cleanupPreview();
            this.reset();
            this.startRecording();
          },
          saveRecording() {
            if (!this.hasAudio) return;
            this.$emit("trigger-event", { name: "saved", event: { value: this.recordedFile } });
            this.stopProgressLoop();
            this.isPlaying = false;
            this.currentTime = 0;
            this.recordedFile = null;
            this.state = "saved";
          },
          reset() {
            this.state = "idle";
            this.elapsed = 0;
            this.errorMessage = "";
            this.isPlaying = false;
            this.currentTime = 0;
            this.durationSec = 0;
          },
          teardownStream() {
            if (this._stream) { this._stream.getTracks().forEach((t) => t.stop()); this._stream = null; }
          },
          cleanupPreview() {
            const win = this.getWin();
            const a = this.$refs.previewAudio;
            if (a) { try { a.pause(); } catch (e) {} }
            this.stopProgressLoop();
            this.isPlaying = false;
            this.currentTime = 0;
            if (this.previewUrl) { win.URL.revokeObjectURL(this.previewUrl); this.previewUrl = null; }
            this.recordedFile = null;
            this._chunks = [];
          },
          startVisualizer(win) {
            const AudioCtx = win.AudioContext || win.webkitAudioContext;
            if (!AudioCtx || !this._stream) return;
            try {
              this._audioContext = new AudioCtx();
              this._analyser = this._audioContext.createAnalyser();
              this._analyser.fftSize = 64;
              this._analyser.smoothingTimeConstant = 0.5;
              const source = this._audioContext.createMediaStreamSource(this._stream);
              source.connect(this._analyser);
              this._freqData = new Uint8Array(this._analyser.frequencyBinCount);
              this._waveformSamples = [];
              this._lastSampleTime = 0;
              this.drawBars(win);
            } catch (e) { /* visualizer optional */ }
          },
          stopVisualizer(win) {
            if (this._animFrameId) { win.cancelAnimationFrame(this._animFrameId); this._animFrameId = null; }
            if (this._audioContext) {
              try { this._audioContext.close(); } catch (e) {}
              this._audioContext = null; this._analyser = null; this._freqData = null;
            }
            this._waveformSamples = [];
            this._lastSampleTime = 0;
          },
          drawBars(win) {
            const canvas = this.$refs.waveformCanvas;
            if (!canvas || !this._analyser) return;
            const ctx = canvas.getContext("2d");
            const W = canvas.width;
            const H = canvas.height;

            const now = Date.now();
            if (now - this._lastSampleTime >= 80) {
              this._lastSampleTime = now;
              this._analyser.getByteFrequencyData(this._freqData);
              let sum = 0;
              for (let i = 0; i < this._freqData.length; i++) sum += this._freqData[i];
              this._waveformSamples.push(sum / this._freqData.length / 255);
            }

            const BAR_W = 3, GAP = 2, STEP = BAR_W + GAP;
            const maxBars = Math.floor(W / STEP);
            const samples = this._waveformSamples;
            const startIdx = Math.max(0, samples.length - maxBars);
            const visible = samples.slice(startIdx);

            ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < visible.length; i++) {
              const val = visible[i];
              const barH = Math.max(4, val * H * 0.9);
              const x = i * STEP;
              const y = (H - barH) / 2;
              const isLast = i === visible.length - 1;
              ctx.fillStyle = isLast ? "#16a34a" : "#22c55e";
              ctx.globalAlpha = isLast ? 1 : 0.55 + val * 0.45;
              ctx.fillRect(Math.round(x), Math.round(y), BAR_W, Math.round(barH));
            }
            ctx.globalAlpha = 1;

            this._animFrameId = win.requestAnimationFrame(() => this.drawBars(win));
          },
        },
        beforeUnmount() {
          const win = this.getWin();
          if (this._timerId) win.clearInterval(this._timerId);
          this.stopVisualizer(win);
          this.stopProgressLoop();
          this.teardownStream();
          this.cleanupPreview();
        },
      };

      const App = {
        components: { AudioRecorder },
        data() {
          const max = Number(new URL(window.location.href).searchParams.get("max")) || 30;
          const saved = new URL(window.location.href).searchParams.get("saved") || "";
          return { content: { maxDurationSeconds: max, savedAudioUrl: saved }, editorState: { isEditing: false } };
        },
        methods: {
          onSaved(p) {
            const f = p.event.value;
            window.__AR_LAST_SAVED__ = f;
            document.getElementById("debug").textContent =
              `saved → name=${f.name}  type=${f.type}  size=${f.size} bytes`;
          },
        },
        template: `<audio-recorder uid="test" :content="content" :ww-editor-state="editorState" @trigger-event="onSaved" />`,
      };

      // Exponer para tests: setear savedAudioUrl reactivamente (simula revisión).
      const app = Vue.createApp(App).mount("#app");
      window.__app__ = app;
      window.__setSaved__ = (url) => { app.content = { ...app.content, savedAudioUrl: url }; };
    </script>
  </body>
</html>
